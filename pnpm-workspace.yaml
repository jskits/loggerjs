packages:
  - "packages/*"
  - "examples/*"
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  simple-git-hooks: false
  workerd: true
# The previous release installed as @loggerjs/browser-previous for upgrade
# tests. List exact versions so the release-age gate still covers every other
# @loggerjs version; update these when bumping the alias.
minimumReleaseAgeExclude:
  - "@loggerjs/browser@0.7.0"
  - "@loggerjs/core@0.7.0"
overrides:
  "@vitejs/plugin-vue>vite": 6.4.3
  "miniflare>ws": 8.21.0
  "read-yaml-file": 2.1.0
  "tsx>esbuild": 0.28.1
  "typed-rest-client>qs": 6.15.2
  "vite@8.0.16>esbuild": 0.28.1
  "vitepress>vite": 6.4.3
